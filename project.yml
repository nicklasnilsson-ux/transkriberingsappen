# XcodeGen-specifikation. Generera Xcode-projektet med:  xcodegen generate
name: Transkribera
options:
  bundleIdPrefix: se.nicklasnilsson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: sv

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.6"
    CURRENT_PROJECT_VERSION: "13"
    DEVELOPMENT_LANGUAGE: sv

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.1.1"
  # Kör Pianissimo (Parakeet TDT). 0.x-versioner kan ändra API, därför exakt version.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.17.7"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
  TranskriberaCore:
    path: Packages/TranskriberaCore
  TranskriberaWhisper:
    path: Packages/TranskriberaWhisper
  TranskriberaSpeakers:
    path: Packages/TranskriberaSpeakers

targets:
  Transkribera:
    type: application
    platform: macOS
    sources:
      - path: Transkribera
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
      - package: FluidAudio
      - package: TranskriberaCore
      - package: TranskriberaWhisper
      - package: TranskriberaSpeakers
      - package: Sparkle
    info:
      path: Transkribera/Resources/Info.plist
      properties:
        CFBundleDisplayName: Transkribera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: sv
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Transkribera spelar in mikrofonen under mötesinspelningar så att även det du själv säger kommer med i texten.
        NSAudioCaptureUsageDescription: Transkribera spelar in datorns ljud under mötesinspelningar så att mötet kan transkriberas. Ljudet stannar på din Mac.
        NSHumanReadableCopyright: "© 2026 Nicklas Nilsson"
        # Automatiska uppdateringar (Sparkle). Appcasten byggs av release-workflowen, se docs/RELEASE.md.
        SUFeedURL: https://raw.githubusercontent.com/nicklasnilsson-ux/transkriberingsappen/appcast/appcast.xml
        SUPublicEDKey: dmT6zJlKWfeD6SE43GqliT6WbqCGQUef5jKO/1kVHMQ=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
    entitlements:
      path: Transkribera/Resources/Transkribera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
        # Sparkles installationstjänst i sandlådan.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - se.nicklasnilsson.transkribera-spks
          - se.nicklasnilsson.transkribera-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.nicklasnilsson.transkribera
        PRODUCT_NAME: Transkribera
        # Härdad runtime slås på av scripts/codesign-app.sh när appen signeras med Developer ID.
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Transkribera:
    build:
      targets:
        Transkribera: all
    run:
      config: Debug
    archive:
      config: Release
