# XcodeGen-specifikation. Generera Xcode-projektet med:  xcodegen generate
name: Transkribera
options:
  bundleIdPrefix: se.nicklasnilsson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: sv

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_LANGUAGE: sv

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.1.1"
  TranskriberaCore:
    path: Packages/TranskriberaCore

targets:
  Transkribera:
    type: application
    platform: macOS
    sources:
      - path: Transkribera
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - package: ArgmaxOSS
        product: SpeakerKit
      - package: TranskriberaCore
    info:
      path: Transkribera/Resources/Info.plist
      properties:
        CFBundleDisplayName: Transkribera
        CFBundleDevelopmentRegion: sv
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Transkribera spelar in mikrofonen under mötesinspelningar så att även det du själv säger kommer med i texten.
        NSAudioCaptureUsageDescription: Transkribera spelar in datorns ljud under mötesinspelningar så att mötet kan transkriberas. Ljudet stannar på din Mac.
        NSHumanReadableCopyright: "© 2026 Nicklas Nilsson"
    entitlements:
      path: Transkribera/Resources/Transkribera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.nicklasnilsson.transkribera
        PRODUCT_NAME: Transkribera
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Transkribera:
    build:
      targets:
        Transkribera: all
    run:
      config: Debug
    archive:
      config: Release
