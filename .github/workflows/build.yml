name: Bygg

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg Transkribera.app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Välj senaste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verktyg
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version

      - name: Enhetstester (TranskriberaCore)
        run: swift test --package-path Packages/TranskriberaCore

      - name: Cache för Swift-paket
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Bygg appen
        run: ./scripts/build-app.sh

      - name: Versionsnamn
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}/\1/p' project.yml | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
               && ! gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Ny version i project.yml som inte släppts än → publicera release automatiskt.
            echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signera och notarisera (om certifikat finns)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-and-notarize.sh

      - name: Skapa .dmg
        run: ./scripts/make-dmg.sh "${{ steps.version.outputs.name }}"

      - name: Ladda upp byggartefakt
        uses: actions/upload-artifact@v4
        with:
          name: Transkribera-${{ steps.version.outputs.name }}
          path: dist/Transkribera-*.dmg
          retention-days: 30

      - name: Ladda upp bygglogg vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publicera release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: Transkribera ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/Transkribera-*.dmg
          generate_release_notes: true
          body: |
            Ladda ner **Transkribera-${{ steps.version.outputs.name }}.dmg** nedan, öppna den och dra Transkribera till Program.
            Kräver en Mac med Apple Silicon (M1 eller senare) och macOS 14 Sonoma eller senare.
            Är appen osignerad: se [README](https://github.com/${{ github.repository }}#installera) för hur du öppnar den första gången.
