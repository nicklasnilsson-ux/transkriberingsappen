name: Bygg

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "Släpp som beta (bara för den som valt betaversioner i appen)"
        type: choice
        options: [inget, beta]
        default: inget

permissions:
  contents: write

concurrency:
  # En betaversion (manuell körning) ska inte avbryta bygget av main och tvärtom.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg Transkribera.app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Välj senaste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verktyg
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version

      - name: Enhetstester (TranskriberaCore)
        run: swift test --package-path Packages/TranskriberaCore

      - name: Cache för Swift-paket
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Versionsnamn
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          MARKETING="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}/\1/p' project.yml | head -1)"
          BUILD="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([0-9]*\)"\{0,1\}/\1/p' project.yml | head -1)"
          released() { gh release view "$1" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          channel=stable release=false short="$MARKETING" build="$BUILD"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "beta" ]]; then
            # Beta av kommande version: byggnumret hamnar mellan förra och nästa stabila version,
            # t.ex. 3.42 mellan 3 och 4, så att den stabila versionen sedan ersätter betan.
            if released "v$MARKETING"; then
              echo "::error::v$MARKETING är redan släppt. Höj MARKETING_VERSION och CURRENT_PROJECT_VERSION i project.yml innan du släpper en beta."
              exit 1
            fi
            channel=beta release=true
            short="$MARKETING-beta.$GITHUB_RUN_NUMBER"
            build="$((BUILD - 1)).$GITHUB_RUN_NUMBER"
            name="v$short"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="$GITHUB_REF_NAME" release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! released "v$MARKETING"; then
            # Ny version i project.yml som inte släppts än → publicera release automatiskt.
            name="v$MARKETING" release=true
          else
            name="dev-$(git rev-parse --short HEAD)"
          fi
          {
            echo "name=$name"
            echo "release=$release"
            echo "channel=$channel"
            echo "short=$short"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $name ($short, bygge $build, kanal $channel, release $release)"

      - name: Python för releaseskripten
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Tester för releaseskripten
        run: $PYTHON -m unittest discover -s scripts

      - name: Kontrollera byggnumret mot appcasten
        if: steps.version.outputs.release == 'true'
        run: |
          if git fetch --quiet origin appcast 2>/dev/null; then
            git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/appcast.xml"
            $PYTHON scripts/appcast.py check "$RUNNER_TEMP/appcast.xml" --version "${{ steps.version.outputs.build }}"
          else
            echo "Ingen appcast än."
          fi

      - name: Bygg appen
        env:
          MARKETING_VERSION_OVERRIDE: ${{ steps.version.outputs.short }}
          BUILD_NUMBER_OVERRIDE: ${{ steps.version.outputs.build }}
        run: ./scripts/build-app.sh

      - name: Signera och notarisera (om certifikat finns)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-and-notarize.sh

      - name: Skapa .dmg
        run: ./scripts/make-dmg.sh "${{ steps.version.outputs.name }}"

      - name: Röktest – startar appen?
        run: |
          ./scripts/smoke-test.sh "dist/Transkribera-${{ steps.version.outputs.name }}.dmg" \
            "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}"

      - name: Ladda upp byggartefakt
        uses: actions/upload-artifact@v4
        with:
          name: Transkribera-${{ steps.version.outputs.name }}
          path: dist/Transkribera-*.dmg
          retention-days: 30

      - name: Ladda upp bygglogg vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Publicera release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: Transkribera ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.channel == 'beta' }}
          make_latest: ${{ steps.version.outputs.channel == 'beta' && 'false' || 'true' }}
          files: |
            dist/Transkribera-*.dmg
            dist/Transkribera-*.zip
          generate_release_notes: true
          body: |
            ${{ steps.version.outputs.channel == 'beta' && '**Betaversion.** Kan innehålla fel. Välj *Inställningar → Uppdateringar → Få betaversioner* i appen för att få betor automatiskt.' || '' }}

            Ladda ner **Transkribera-${{ steps.version.outputs.name }}.dmg** nedan, öppna den och dra Transkribera till Program.
            Kräver en Mac med Apple Silicon (M1 eller senare) och macOS 14 Sonoma eller senare.
            Är appen osignerad: se [README](https://github.com/${{ github.repository }}#installera) för hur du öppnar den första gången.
            Har du redan Transkribera 0.4.0 eller senare uppdateras appen själv.

      - name: Uppdatera appcast (automatiska uppdateringar)
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ./scripts/publish-appcast.sh "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}" "${{ steps.version.outputs.channel }}"
