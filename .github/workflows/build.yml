name: Bygg

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: "Släpp som beta (bara för den som valt betaversioner i appen)"
        type: choice
        options: [inget, beta]
        default: inget

permissions:
  contents: write

# Inget når användarna förrän det har klarat alla kontroller (docs/KONTROLLER.md):
# releasen skapas som utkast, den publicerade .dmg:n laddas ner och kontrolleras, och först
# då blir releasen synlig och hamnar i appcasten.

concurrency:
  # En betaversion (manuell körning) ska inte avbryta bygget av main och tvärtom.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg Transkribera.app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Välj senaste Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verktyg
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version

      - name: Enhetstester (TranskriberaCore)
        run: swift test --package-path Packages/TranskriberaCore

      - name: Cache för Swift-paket
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Versionsnamn
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          MARKETING="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}/\1/p' project.yml | head -1)"
          BUILD="$(sed -n 's/^ *CURRENT_PROJECT_VERSION: *"\{0,1\}\([0-9]*\)"\{0,1\}/\1/p' project.yml | head -1)"
          # Ett utkast (en release som stoppades av kontrollerna) räknas inte som släppt.
          released() { [[ "$(gh release view "$1" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" == false ]]; }
          channel=stable release=false short="$MARKETING" build="$BUILD"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_CHANNEL" == "beta" ]]; then
            # Beta av kommande version: byggnumret hamnar mellan förra och nästa stabila version,
            # t.ex. 3.42 mellan 3 och 4, så att den stabila versionen sedan ersätter betan.
            if released "v$MARKETING"; then
              echo "::error::v$MARKETING är redan släppt. Höj MARKETING_VERSION och CURRENT_PROJECT_VERSION i project.yml innan du släpper en beta."
              exit 1
            fi
            channel=beta release=true
            short="$MARKETING-beta.$GITHUB_RUN_NUMBER"
            build="$((BUILD - 1)).$GITHUB_RUN_NUMBER"
            name="v$short"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="$GITHUB_REF_NAME" release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] && ! released "v$MARKETING"; then
            # Ny version i project.yml som inte släppts än → publicera release automatiskt.
            name="v$MARKETING" release=true
          else
            name="dev-$(git rev-parse --short HEAD)"
            # Utvecklingsbyggen får ett byggnummer över förra versionen, så att
            # uppgraderingstestet kan uppdatera förra versionen till det här bygget.
            if released "v$MARKETING"; then build="$BUILD.$GITHUB_RUN_NUMBER"; else build="$((BUILD - 1)).$GITHUB_RUN_NUMBER"; fi
          fi
          # En ny version ska ha ett avsnitt i CHANGELOG.md, redan i PR:en som höjer den.
          if [[ "$channel" == stable ]] && ! released "v$MARKETING"; then
            python3 scripts/changelog.py check "$MARKETING"
          fi
          # Releasen skapas som utkast under den riktiga taggen; övriga byggen under en tillfällig.
          draft="$name"
          [[ "$release" == true ]] || draft="ci-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            echo "name=$name"
            echo "draft=$draft"
            echo "release=$release"
            echo "channel=$channel"
            echo "short=$short"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $name ($short, bygge $build, kanal $channel, release $release)"

      - name: Python för releaseskripten
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r scripts/requirements.txt
          echo "PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Tester för releaseskripten
        run: $PYTHON -m unittest discover -s scripts

      - name: Kontrollera byggnumret mot appcasten
        if: steps.version.outputs.release == 'true'
        run: |
          if git fetch --quiet origin appcast 2>/dev/null; then
            git show FETCH_HEAD:appcast.xml > "$RUNNER_TEMP/appcast.xml"
            $PYTHON scripts/appcast.py check "$RUNNER_TEMP/appcast.xml" --version "${{ steps.version.outputs.build }}"
          else
            echo "Ingen appcast än."
          fi

      - name: Bygg appen
        env:
          MARKETING_VERSION_OVERRIDE: ${{ steps.version.outputs.short }}
          BUILD_NUMBER_OVERRIDE: ${{ steps.version.outputs.build }}
        run: ./scripts/build-app.sh

      - name: Signera och notarisera (om certifikat finns)
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-and-notarize.sh

      - name: Skapa .dmg
        run: ./scripts/make-dmg.sh "${{ steps.version.outputs.name }}"

      - name: Röktest – signaturer, ramverk och start
        run: |
          ./scripts/smoke-test.sh "dist/Transkribera-${{ steps.version.outputs.name }}.dmg" \
            "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}"

      - name: Uppgraderingstest – förra versionen uppdaterar sig och behåller data
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          previous="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 20 \
            --json tagName -q '.[].tagName' | grep -E '^v[0-9]' | grep -vx "$NAME" | head -1)"
          echo "Förra versionen: $previous"
          gh release download "$previous" -R "$GITHUB_REPOSITORY" -p "Transkribera-$previous.dmg" -D "$RUNNER_TEMP/previous"
          ./scripts/upgrade-test.sh "$RUNNER_TEMP/previous/Transkribera-$previous.dmg" \
            "dist/Transkribera-$NAME.zip" "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}"

      - name: Låsta paketversioner
        run: cat Package.resolved

      - name: Ladda upp byggartefakt
        uses: actions/upload-artifact@v4
        with:
          name: Transkribera-${{ steps.version.outputs.name }}
          path: dist/Transkribera-*.dmg
          retention-days: 30

      - name: Ladda upp bygglogg vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Release-text från CHANGELOG.md
        if: github.event.pull_request.head.repo.fork != true
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
          SHORT: ${{ steps.version.outputs.short }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          {
            if [[ "$CHANNEL" == beta ]]; then
              echo "**Betaversion.** Kan innehålla fel. Välj *Inställningar → Uppdateringar → Få betaversioner* i appen för att få betor automatiskt."
              echo
            fi
            python3 scripts/changelog.py notes "${SHORT%%-beta*}"
            echo
            echo "Ladda ner **Transkribera-$NAME.dmg** nedan, öppna den och dra Transkribera till Program."
            echo "Kräver en Mac med Apple Silicon (M1 eller senare) och macOS 14 Sonoma eller senare."
            echo "Är appen osignerad: se [README](https://github.com/$GITHUB_REPOSITORY#installera) för hur du öppnar den första gången."
            echo "Har du redan Transkribera 0.4.2 eller senare uppdateras appen själv."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Ta bort gammalt utkast
        if: github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.draft }}
        run: |
          if [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi

      - name: Skapa releasen som utkast
        if: github.event.pull_request.head.repo.fork != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.draft }}
          name: Transkribera ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ steps.version.outputs.channel == 'beta' }}
          files: |
            dist/Transkribera-*.dmg
            dist/Transkribera-*.zip
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-notes.md

      # Körs på varje bygge, så att grinden är testad innan den behövs. Bygget som inte
      # ska släppas laddas upp till ett tillfälligt utkast som tas bort efteråt.
      - name: Release-grind – kontrollera filerna som laddas upp
        if: github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.draft }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          dir="$RUNNER_TEMP/published"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$dir"
          for file in "Transkribera-$NAME.dmg" "Transkribera-$NAME.zip"; do
            [[ "$(shasum -a 256 < "$dir/$file")" == "$(shasum -a 256 < "dist/$file")" ]] \
              || { echo "::error::$file i releasen skiljer sig från det som byggdes."; exit 1; }
          done
          ./scripts/smoke-test.sh "$dir/Transkribera-$NAME.dmg" \
            "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}"
          # Uppdateringsfilen (zip) ska innehålla samma app.
          mkdir "$dir/zip" && ditto -x -k "$dir/Transkribera-$NAME.zip" "$dir/zip"
          codesign --verify --deep --strict "$dir/zip/Transkribera.app"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$dir/zip/Transkribera.app/Contents/Info.plist")" == "${{ steps.version.outputs.build }}" ]]

      - name: Publicera releasen
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.name }}
          BETA: ${{ steps.version.outputs.channel == 'beta' }}
        run: |
          if [[ "$BETA" == true ]]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Ta bort det tillfälliga utkastet
        if: always() && steps.version.outputs.release != 'true' && github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.draft }}
        run: |
          if [[ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi

      - name: Uppdatera appcast (automatiska uppdateringar)
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ./scripts/publish-appcast.sh "${{ steps.version.outputs.name }}" \
            "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}" "${{ steps.version.outputs.channel }}"
